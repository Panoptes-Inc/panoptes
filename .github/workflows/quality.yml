name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SUPABASE_URL: https://example.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      PUBLIC_USE_MOCK_API: 'true'
      PUBLIC_TURNSTILE_SITE_KEY: ci-placeholder-site-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Sync SvelteKit types
        run: npx svelte-kit sync

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Validate OpenAPI draft
        run: npm run check:openapi

      - name: Unit tests
        run: npm run test

      - name: Auth development smoke tests
        run: npm run test:auth-smoke

      - name: Production build
        run: npm run build

      - name: Client secret boundary
        run: npm run test:secrets

      - name: Route smoke tests
        run: npm run test:smoke
