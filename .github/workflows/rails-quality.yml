name: Rails quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: panoptes
          POSTGRES_PASSWORD: panoptes_test_only
          POSTGRES_DB: panoptes_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U panoptes -d panoptes_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: panoptes
      POSTGRES_PASSWORD: panoptes_test_only
      SUPABASE_JWT_ISSUER: https://test.supabase.co/auth/v1
      SUPABASE_JWT_AUDIENCE: authenticated
      SUPABASE_JWKS_URL: https://test.supabase.co/auth/v1/.well-known/jwks.json
      SUPABASE_JWT_ALGORITHMS: RS256
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.10
          bundler-cache: true
          working-directory: rails
      - run: bundle exec rails db:prepare
      - run: bundle exec rails test
      - run: bundle exec rubocop
      - run: bundle exec brakeman --no-pager -q
      - run: bundle exec bundler-audit check --update
